<!--
  받침 놀이터 — 초등학교 1학년 받침 학습 앱 (소리 탐구 단일 흐름)
  교육과정·교사 피드백 반영:
    · 핵심 개념: "받침 글자가 달라도 소리는 같을 수 있다"(7개 대표음)
    · 활동: 듣기 → 따라 말하기(녹음 후 다시 듣기) → 써 보기(획순)
    · 어려운 받침 채우기/분류 게임은 제외하고 간단하게 구성
  7개 대표 받침: ㄱ[윽] ㄴ[은] ㄷ[읃] ㄹ[을] ㅁ[음] ㅂ[읍] ㅇ[응]
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>받침 놀이터</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@700;800&display=swap');
  body, button, input { font-family:'Nanum Gothic','Jua',sans-serif;
    word-break:keep-all; overflow-wrap:break-word; }
  :root{
    --bg1:#fff7e6; --bg2:#ffe8d6; --bg3:#d6f0ff;
    --ink:#3a2e2a;
    --sun:#ffb627; --sun-d:#f59300;
    --grass:#5fc77b; --grass-d:#3fa85c;
    --sky:#4aa8e8; --sky-d:#2e89c9;
    --berry:#ff7a8a; --berry-d:#e8556a;
    --grape:#9b7ede;
    --card:#ffffff;
    --shadow:0 6px 0 rgba(0,0,0,.10), 0 10px 20px rgba(0,0,0,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    height:100dvh;          /* 동적 뷰포트 높이: 태블릿 주소창 변화에도 스크롤 없음 */
    overflow:hidden;        /* 스크롤 절대 금지 */
    position:fixed;         /* 뷰포트 완전 고정 (iOS 사파리 바운스 방지) */
    inset:0;
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  body{
    font-family:'Jua',sans-serif; color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    display:flex; flex-direction:column;
  }

  /* ── 전체 레이아웃: 헤더 + 콘텐츠 영역 꽉 채움 ── */
  .wrap{
    display:flex; flex-direction:column;
    width:100%; height:100%;
    padding:0; overflow:hidden;
  }
  header{
    flex-shrink:0;
    text-align:center; padding:clamp(2px,.5vh,6px) 0 clamp(1px,.3vh,4px);
  }
  header h1{
    margin:0; font-size:clamp(1.4rem,3.5vw,2.4rem);
    letter-spacing:2px; color:var(--berry-d);
    text-shadow:2px 2px 0 #fff, 4px 4px 0 rgba(0,0,0,.08);
  }
  header h1 .b{color:var(--sky-d);}
  header p{
    font-family:'Nanum Gothic'; font-weight:700; color:#8a7b73;
    margin:2px 0 0; font-size:clamp(.75rem,1.6vw,1rem);
  }

  /* ── 뷰 영역: 남은 공간을 전부 차지, 내부 스크롤 없음 ── */
  #view{
    flex:1; overflow:hidden; min-height:0;
    padding:clamp(4px,.8vh,10px) clamp(6px,1.2vw,14px) clamp(4px,.8vh,8px);
    display:flex; flex-direction:column;
  }

  /* home-fab: 뷰포트 고정 */
  .home-fab{
    position:fixed; bottom:clamp(10px,2vh,20px); right:clamp(10px,2vw,20px);
    z-index:50;
  }

  header{text-align:center;padding:clamp(4px,1vh,8px) 0 clamp(1px,.3vh,2px);flex-shrink:0;position:relative;}
  .sound-toggle{position:absolute;right:clamp(6px,1.5vw,16px);top:50%;transform:translateY(-50%);
    background:#fff;border:3px solid var(--sun);border-radius:50%;
    width:clamp(40px,6vh,52px);height:clamp(40px,6vh,52px);font-size:clamp(1.1rem,2.5vh,1.5rem);
    cursor:pointer;box-shadow:0 3px 0 rgba(245,147,0,.3);transition:.12s;z-index:10;}
  .sound-toggle:active{transform:translateY(-50%) scale(.92);}
  .sound-toggle.off{border-color:#cbc3b8;box-shadow:0 3px 0 rgba(0,0,0,.1);opacity:.6;}
  /* 학생 이름 칩 — 스피커 토글 왼쪽에 항상 배치 */
  .name-chip{position:absolute;top:50%;transform:translateY(-50%);
    right:calc(clamp(6px,1.5vw,16px) + clamp(40px,6vh,52px) + 10px);
    background:#fff;border:3px solid var(--sky);border-radius:999px;
    padding:clamp(5px,1vh,9px) clamp(12px,2vw,18px);
    font-family:'Jua';color:var(--sky-d);font-size:clamp(1rem,2.2vh,1.4rem);
    box-shadow:0 3px 0 rgba(91,170,230,.25);z-index:10;white-space:nowrap;max-width:38vw;overflow:hidden;text-overflow:ellipsis;}
  header h1{margin:0;font-size:clamp(2rem,5vh,3.2rem);letter-spacing:2px;color:var(--berry-d);
    text-shadow:3px 3px 0 #fff, 5px 5px 0 rgba(0,0,0,.08);}
  header h1 .b{color:var(--sky-d);}
  header p{font-family:'Nanum Gothic';font-weight:700;color:#8a7b73;margin:clamp(2px,.5vh,6px) 0 0;font-size:clamp(1rem,2vh,1.35rem);}

  /* 받침 카드 그리드 (대표 받침 7개) */
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,360px));gap:clamp(10px,2vw,20px);
    margin-top:clamp(8px,1.5vh,16px); flex:1; align-content:start; justify-content:center;}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,360px));}}
  @media(max-width:500px){.grid{grid-template-columns:minmax(0,1fr);}}
  .jcard{border:none;cursor:pointer;text-align:left;background:var(--card);
    border-radius:clamp(14px,2vw,24px);padding:clamp(12px,1.8vw,20px);box-shadow:var(--shadow);
    border:4px solid var(--c,#eee);transition:transform .12s, box-shadow .12s;
    display:flex;align-items:center;gap:clamp(8px,1.2vw,14px);}
  .jcard:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.1);}
  .jcard .jbig{font-size:clamp(2.4rem,4vw,3rem);width:clamp(60px,8vw,76px);height:clamp(60px,8vw,76px);flex:none;display:grid;place-items:center;
    border-radius:18px;background:var(--cb,#fff3e0);color:var(--c);font-family:'Jua';}
  .jcard .jt{font-size:clamp(1.3rem,2.2vw,1.7rem);font-family:'Jua';}
  .jcard .jt small{display:block;font-family:'Nanum Gothic';font-weight:700;font-size:clamp(1rem,1.6vw,1.25rem);color:#8a7b73;margin-top:2px;}
  .jcard .done-badge{margin-left:auto;font-size:1.6rem;}

  .all-done{grid-column:1/-1;text-align:center;background:var(--card);border-radius:24px;
    padding:18px;box-shadow:var(--shadow);border:4px solid var(--sun);animation:pop .3s;}
  .all-done .em{font-size:3rem;}

  /* 상세 화면 */
  .detail{background:var(--card);border-radius:clamp(10px,1.5vw,20px);
    padding:clamp(10px,1.5vw,20px) clamp(10px,2vw,20px) clamp(10px,1.5vh,18px);
    box-shadow:var(--shadow);animation:pop .3s ease;
    display:flex;flex-direction:column;flex:1;overflow:hidden;min-height:0;}
  .step-dots{display:flex;justify-content:center;gap:8px;margin-bottom:clamp(6px,1vh,14px);flex-shrink:0;}
  .sdot{display:flex;align-items:center;gap:5px;font-family:'Nanum Gothic';font-weight:700;
    font-size:clamp(.7rem,1.5vw,.95rem);color:#bbab9f;}
  .sdot .c{width:clamp(18px,2.5vw,24px);height:clamp(18px,2.5vw,24px);border-radius:50%;display:grid;place-items:center;
    background:#f0e7df;color:#bbab9f;font-size:clamp(.7rem,1.4vw,.85rem);}
  .sdot.on{color:var(--sky-d);} .sdot.on .c{background:var(--sky);color:#fff;}
  .sdot.ok .c{background:var(--grass);color:#fff;}

  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}

  /* ── 받침 완료 축하 화면 ── */
  .finish-card{background:var(--card);border-radius:clamp(14px,2vw,24px);
    padding:clamp(16px,3vh,32px) clamp(16px,3vw,28px);box-shadow:var(--shadow);
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(10px,2vh,20px);overflow:hidden;min-height:0;animation:pop .35s ease;
    background:radial-gradient(circle at 50% 30%, var(--cb,#fff3e0) 0%, var(--card) 65%);}
  .finish-burst{position:relative;display:flex;align-items:center;justify-content:center;}
  .finish-medal{font-size:clamp(4.5rem,14vh,8rem);line-height:1;animation:medalPop .6s cubic-bezier(.2,1.4,.5,1) both, medalFloat 2.2s ease-in-out 0.6s infinite;}
  @keyframes medalPop{0%{transform:scale(0) rotate(-30deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
  @keyframes medalFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
  .finish-burst .spark{position:absolute;font-size:clamp(1.4rem,3.5vh,2.4rem);animation:sparkTwinkle 1.6s ease-in-out infinite;}
  .finish-burst .s1{top:-6px;left:-50px;animation-delay:0s;}
  .finish-burst .s2{top:-18px;right:-46px;animation-delay:.3s;}
  .finish-burst .s3{bottom:-8px;left:-44px;animation-delay:.6s;}
  .finish-burst .s4{bottom:-14px;right:-48px;animation-delay:.9s;}
  @keyframes sparkTwinkle{0%,100%{transform:scale(.7) rotate(0);opacity:.5}50%{transform:scale(1.2) rotate(15deg);opacity:1}}
  .finish-badge{display:flex;align-items:center;gap:clamp(10px,2vw,18px);
    background:#fff;border:4px solid var(--c,#f59300);border-radius:999px;
    padding:clamp(8px,1.5vh,14px) clamp(18px,3vw,28px);box-shadow:0 5px 0 var(--cb,rgba(245,147,0,.3));}
  .finish-badge .fb-jong{font-family:'Jua';font-size:clamp(2.4rem,6vh,4rem);color:var(--c,#f59300);
    width:clamp(54px,9vh,80px);height:clamp(54px,9vh,80px);border-radius:18px;background:var(--cb,#fff3e0);
    display:grid;place-items:center;line-height:1;}
  .finish-badge .fb-txt{font-family:'Jua';font-size:clamp(1.4rem,3.2vh,2.2rem);color:var(--ink);text-align:left;line-height:1.25;}
  .finish-badge .fb-txt b{color:var(--c,#f59300);font-size:1.2em;}
  .finish-msg{font-family:'Nanum Gothic';font-weight:700;color:#6b5d55;
    font-size:clamp(1.15rem,2.6vh,1.7rem);text-align:center;line-height:1.5;margin:0;word-break:keep-all;}
  .finish-msg b{color:var(--berry-d);}
  .finish-progress{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.2vh,12px);}
  .prog-stamps{display:flex;gap:clamp(5px,1vw,10px);}
  .prog-stamp{width:clamp(34px,5.5vh,50px);height:clamp(34px,5.5vh,50px);border-radius:14px;
    display:grid;place-items:center;font-family:'Jua';font-size:clamp(1.2rem,3vh,2rem);
    background:#efe7df;color:#c5b9ad;border:3px dashed #d8cdc0;}
  .prog-stamp.on{background:var(--cb,#fff3e0);color:var(--c,#f59300);border:3px solid var(--c,#f59300);
    box-shadow:0 3px 0 rgba(0,0,0,.08);animation:stampIn .4s ease both;}
  @keyframes stampIn{from{transform:scale(0)}to{transform:scale(1)}}
  .prog-label{font-family:'Nanum Gothic';font-weight:800;color:#8a7b73;font-size:clamp(1rem,2.2vh,1.4rem);}
  .prog-label b{color:var(--berry-d);font-size:1.2em;}
  .finish-card.all .finish-msg b{color:var(--berry-d);}
  .finish-card .row-btns .btn{white-space:nowrap;}

  #stepBody{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}

  .lead{font-family:'Nanum Gothic';font-weight:800;font-size:clamp(.9rem,2vw,1.2rem);
    text-align:center;color:var(--sky-d);margin:0 0 clamp(2px,.5vh,4px);flex-shrink:0;}
  .instr{font-family:'Nanum Gothic';font-size:clamp(.8rem,1.6vw,1.05rem);font-weight:700;
    text-align:center;color:#7c6d65;margin:0 0 clamp(4px,1vh,12px);flex-shrink:0;}

  /* STEP1 소리 탐험 */
  .sound-hero{text-align:center;background:var(--cb,#fff3e0);border-radius:20px;padding:clamp(14px,2.5vh,24px);margin-bottom:14px;}
  .sound-hero .snd{font-size:clamp(3rem,8vh,5.5rem);font-family:'Jua';color:var(--c);}
  .sound-hero .lbl{font-family:'Nanum Gothic';font-weight:800;font-size:clamp(1.2rem,2.8vh,1.7rem);color:#7c6d65;margin-top:6px;word-break:keep-all;line-height:1.5;}
  .letters-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0 4px;}
  .letter-chip{cursor:pointer;border:none;min-width:64px;height:72px;border-radius:18px;background:#fff;
    box-shadow:0 5px 0 rgba(0,0,0,.12);border:3px solid var(--c);transition:.12s;
    display:grid;place-items:center;font-family:'Jua';color:var(--ink);padding:0 8px;}
  .letter-chip .lc{font-size:1.9rem;line-height:1;}
  .letter-chip .ls{font-family:'Nanum Gothic';font-size:.8rem;color:var(--c);margin-top:2px;}
  .letter-chip:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.12);}
  .letter-chip.lit{background:var(--cb,#fff8e8);}
  .letter-chip.heard{outline:3px solid var(--grass);}
  /* 연필요정 + 말풍선 — 가로 배치(요정 왼쪽, 말풍선 오른쪽), 컴팩트 */
  .fairy-bar{display:flex;flex-direction:row;align-items:center;justify-content:center;
    gap:clamp(6px,1.2vw,12px);flex-shrink:0;margin:clamp(1px,.2vh,4px) 0 clamp(3px,.6vh,6px);}
  .fairy-bar .bubble{position:relative;background:#fff;border:3px solid var(--sun);
    border-radius:18px;padding:clamp(9px,1.6vh,15px) clamp(14px,2.4vw,22px);
    font-family:'Jua';color:var(--ink);font-size:clamp(1.2rem,2.8vh,1.7rem);
    box-shadow:0 4px 0 rgba(245,147,0,.25);line-height:1.35;text-align:left;word-break:keep-all;}
  .fairy-bar .bubble b{color:var(--berry-d);}
  /* 말풍선 꼬리 — 왼쪽(요정 방향) */
  .fairy-bar .bubble::before{content:'';position:absolute;left:-15px;top:50%;transform:translateY(-50%);
    border:8px solid transparent;border-right-color:var(--sun);}
  .fairy-bar .bubble::after{content:'';position:absolute;left:-9px;top:50%;transform:translateY(-50%);
    border:7px solid transparent;border-right-color:#fff;}
  /* 요정 크기 & 애니메이션 (컴팩트) */
  .fairy{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;
    animation:fairyFloat 2.5s ease-in-out infinite;}
  .fairy .pfairy-svg{width:clamp(40px,6.5vh,64px);height:auto;display:block;}
  @keyframes fairyFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  /* 예시 낱말 */
  .ex-grid{display:grid;grid-template-columns:repeat(3,minmax(0,300px));
    gap:clamp(10px,1.5vw,18px);justify-items:stretch;justify-content:center;
    margin-top:clamp(2px,.4vh,6px);flex:1;align-content:start;overflow:hidden;
    width:100%;}
  @media(max-width:700px){.ex-grid{grid-template-columns:repeat(2,minmax(0,300px));}}
  .ex-card{position:relative;background:var(--bg1);border-radius:18px;width:100%;
    padding:clamp(10px,1.6vh,16px) clamp(8px,1.2vw,14px);text-align:center;cursor:pointer;
    border:3px solid transparent;transition:.12s;}
  .ex-card:active{transform:scale(.95);}
  .ex-card.lit{border-color:var(--sun);background:#fff8e8;}
  /* 소리를 들은 카드: 초록 배경 + 체크 배지로 누적 표시 */
  .ex-card.heard{border-color:var(--grass);background:#eafaf0;}
  .ex-card.heard::after{content:'✓';position:absolute;top:4px;right:6px;
    width:24px;height:24px;border-radius:50%;background:var(--grass);color:#fff;
    font-size:.9rem;font-weight:800;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 0 rgba(0,0,0,.12);}
  .ex-card.lit.heard{border-color:var(--sun);}
  .ex-card .ee{font-size:clamp(2.6rem,6vh,4rem);}
  .ex-card .ew{font-family:'Nanum Gothic',sans-serif;font-weight:800;font-size:clamp(1.5rem,3.5vh,2.4rem);display:flex;align-items:flex-start;justify-content:center;gap:4px;flex-wrap:nowrap;margin-top:4px;}
  .ex-card .ew .hl{color:var(--berry-d);}
  /* 단어 카드 안의 자모 박스 */
  .ex-card .ew .mbox{font-size:clamp(1.4rem,3.2vh,2.1rem);width:1.35em;height:1.35em;border-width:2.5px;}
  /* 페이지 넘김 */
  .pager{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.5vw,14px);
    margin:clamp(4px,.6vh,8px) 0 0;flex-shrink:0;}
  .pager-btn{font-family:'Jua';font-size:clamp(1rem,2.2vh,1.4rem);border:none;cursor:pointer;
    background:var(--sky);color:#fff;border-radius:14px;width:clamp(44px,7vw,56px);height:clamp(40px,6vh,52px);
    box-shadow:0 4px 0 var(--sky-d);transition:.12s;}
  .pager-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sky-d);}
  .pager-btn:disabled{background:#d7d0c6;box-shadow:0 4px 0 #bcb4a8;cursor:default;}
  .pager-info{font-family:'Jua';font-size:clamp(.95rem,2vh,1.2rem);color:#7c6d65;min-width:80px;}
  /* 음절을 초성·중성·종성 자모 박스로 분해 표시 (단어 카드/토큰 공용) */
  .wsyl{display:inline-flex;align-items:flex-start;}
  .mblock{display:inline-flex;flex-direction:column;align-items:center;gap:2px;vertical-align:top;margin:0 2px;}
  .mtop{display:flex;gap:2px;align-items:center;justify-content:center;}
  .mtop.vert{flex-direction:column;}
  .mbox{font-family:'Nanum Gothic',sans-serif;font-weight:800;font-size:clamp(1.6rem,4vh,2.8rem);line-height:1;
    width:1.4em;height:1.4em;display:flex;align-items:center;justify-content:center;
    background:#fff;border:2px solid #e5e0d6;border-radius:6px;color:var(--ink);}
  .mbox.mj{border-width:2px;}

  /* STEP2 따라 말하기 + 녹음 */
  .say-word{text-align:center;}
  .say-word .se{font-size:clamp(5rem,14vh,9rem);line-height:1;}
  .say-word .sw{font-family:'Nanum Gothic',sans-serif;font-weight:800;font-size:clamp(3rem,8vh,5.5rem);}
  .say-word .sw .hl{color:var(--berry-d);}
  .rec-controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px;}
  .rec-msg{font-family:'Nanum Gothic';font-weight:700;text-align:center;font-size:clamp(.8rem,1.6vw,1.05rem);color:#7c6d65;min-height:0;margin-top:clamp(4px,.8vh,8px);flex-shrink:0;word-break:keep-all;white-space:normal;}
  /* 음성 인식 결과 표시 */
  .heard-box{font-family:'Nanum Gothic';font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-size:clamp(1rem,2.2vh,1.4rem);border-radius:16px;padding:clamp(8px,1.5vh,14px);
    margin:clamp(6px,1vh,10px) auto 0;flex-shrink:0;}
  .heard-box.ok{background:#eafaf0;color:var(--grass-d);border:3px solid var(--grass);}
  .heard-box.no{background:#fff0f0;color:var(--berry-d);border:3px solid var(--berry);}
  .heard-box b{font-size:1.15em;}
  .recdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--berry);
    margin-right:6px;animation:blink .8s infinite;}
  @keyframes blink{50%{opacity:.2}}
  /* 발음 안내 */
  .pron-hint{font-family:'Nanum Gothic';font-weight:800;text-align:center;
    font-size:clamp(1.2rem,3vh,1.8rem);color:#7c6d65;margin:clamp(4px,1vh,10px) 0;flex-shrink:0;}
  .pron-hint b{color:var(--sky-d);}

}

// 자모 하나를 박스 안에 SVG 획으로 그림. strokeStart=이 자모 첫 획의 전역 순서 인덱스
function glyphBox(j,batchim,strokeStart,clickable){
  const paths=STROKES[j]||[];
  const ghost=paths.map(d=>`<path class="ghost" d="${d}" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  const ink=paths.map((d,i)=>`<path class="ink" data-order="${(strokeStart||0)+i}" d="${d}" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  const clickAttr=clickable?` data-jamo="${j}" class="glyph-box${batchim?' batchim':''} jamo-click"`:` class="glyph-box${batchim?' batchim':''}"`;
  return `<div${clickAttr}><svg viewBox="0 0 100 100">${ghost}${ink}</svg></div>`;
}
// 가로 모음(초성 아래에 오는 모음): ㅗ ㅛ ㅜ ㅠ ㅡ
const HORIZONTAL_VOWELS=['ㅗ','ㅛ','ㅜ','ㅠ','ㅡ'];
// 이중(복합) 모음: 세로획을 포함하므로 초성 오른쪽(세로형)으로 배치
const COMPLEX_VOWELS=['ㅘ','ㅙ','ㅚ','ㅝ','ㅞ','ㅟ','ㅢ'];
// 이중모음을 쓰기 가능한 구성 자모로 분해 (획순 학습용)
const VOWEL_PARTS={
  'ㅘ':['ㅗ','ㅏ'], 'ㅙ':['ㅗ','ㅐ'], 'ㅚ':['ㅗ','ㅣ'],
  'ㅝ':['ㅜ','ㅓ'], 'ㅞ':['ㅜ','ㅔ'], 'ㅟ':['ㅜ','ㅣ'], 'ㅢ':['ㅡ','ㅣ'],
};
// 한 글자의 짜임을 올바른 배치로 그리기
//  - 세로 모음(ㅏㅓ…): [초성][모음]  가로 배열
//  - 가로 모음(ㅗㅜㅡ…): [초성] 위 / [모음] 아래  세로 배열
//  - 받침: 항상 맨 아래
function syllableBlock(cho,jung,jong,strokeOffset,clickable){
  const vert = HORIZONTAL_VOWELS.includes(jung);
  let start=strokeOffset||0;
  const choBox=glyphBox(cho,false,start,clickable);   start+=(STROKES[cho]||[]).length;
  const jungBox=jung?glyphBox(jung,false,start,clickable):''; if(jung) start+=(STROKES[jung]||[]).length;
  const top = `<div class="syl-top${vert?' vert':''}">${choBox}${jungBox}</div>`;
  const bottom = jong?`${glyphBox(jong,true,start,clickable)}`:'';
  return `<div class="syl-block">${top}${bottom}</div>`;
}
// 한 글자의 획 개수 합
function syllableStrokeCount(cho,jung,jong){
  return (STROKES[cho]||[]).length + (jung?(STROKES[jung]||[]).length:0) + (jong?(STROKES[jong]||[]).length:0);
}
// 단어 전체를 음절 블록들로 (획 순서는 단어 전체에 걸쳐 누적)
// clickable=true 면 각 음절에 data-syl 인덱스 부여(개별 보기용)
function wordBlocks(word, clickable){
  let offset=0; const parts=[]; let si=0;
  [...word].forEach(ch=>{
    const d=decompose(ch);
    if(!d){ parts.push(`<div class="syl-block">${ch}</div>`); si++; return; }
    const [cho,jung,jong]=d;
    parts.push(syllableBlock(cho,jung,jong,offset,clickable));
    offset+=syllableStrokeCount(cho,jung,jong);
    si++;
  });
  return parts.join('');
}

/* ===== 음성 합성 ===== */
// 자연스러운 한국어 음성 우선 선택 (Google → Wavenet/Neural2 → 자연스러움 키워드)
let pickedVoice=null, voiceReady=false;
function pickKoreanVoice(){
  if(!('speechSynthesis'in window))return null;
  const voices=speechSynthesis.getVoices();
  if(!voices||!voices.length)return null;
  const ko=voices.filter(v=>(v.lang||'').toLowerCase().startsWith('ko'));
  if(!ko.length)return null;
  // 1순위: Google 한국어 클라우드 음성 (가장 자연스러움)
  let v=ko.find(x=>x.name.toLowerCase().includes('google') && !x.localService);
  if(v)return v;
  // 2순위: Wavenet / Neural2 (Google Cloud)
  v=ko.find(x=>/wavenet|neural2|neural/i.test(x.name));
  if(v)return v;
  // 3순위: 자연스러움 키워드
  v=ko.find(x=>/premium|enhanced|natural/i.test(x.name));
  if(v)return v;
  // 4순위: Google 한국어 (로컬 포함)
  v=ko.find(x=>x.name.toLowerCase().includes('google'));
  if(v)return v;
  return ko[0];
}
function ensureVoice(){
  if(!voiceReady){ pickedVoice=pickKoreanVoice(); if(pickedVoice)voiceReady=true; }
  return pickedVoice;
}
if('speechSynthesis'in window){
  speechSynthesis.onvoiceschanged=()=>{ pickedVoice=pickKoreanVoice(); if(pickedVoice)voiceReady=true; };
  ensureVoice();
}

// 한 발화 (자연스러운 음성, pitch 1.0)
function utter(text,rate){
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ko-KR'; u.rate=(rate||0.85); u.pitch=1.0;
  const v=ensureVoice(); if(v)u.voice=v;
  return u;
}

// 소리 켜짐/꺼짐 (스피커 토글)
let soundOn=true;

// 단어를 한 글자씩 끊어서 읽기 (낙.타. 처럼, 글자 사이 간격은 짧게)
let speakTimers=[];
// 낱말에서 받침 음절(hi 인덱스)만 추출
function batchimSyl(word, hi){
  return [...word][hi] || word;
}

function speak(text,rate){
  try{
    if(!('speechSynthesis'in window))return;
    speechSynthesis.cancel();
    speakTimers.forEach(t=>clearTimeout(t)); speakTimers=[];
    const chars=[...String(text)].filter(c=>c.trim()!=='');
    if(chars.length<=1){
      const ch=chars[0]||text;
      // 마침표를 붙여 TTS가 받침을 자음명 없이 읽도록 함
      speechSynthesis.speak(utter(ch+'.',rate||0.85));
      return;
    }
    // 여러 글자: 한 글자씩 끊어 읽기 (낙.타. 처럼)
    const GAP=0;
    let i=0;
    const sayNext=()=>{
      if(i>=chars.length) return;
      const ch=chars[i++];
      const u=utter(ch+'.',rate||0.85);
      u.onend=()=>{ if(i<chars.length) sayNext(); };
      speechSynthesis.speak(u);
    };
    sayNext();
  }catch(e){}
}
// 안내 문구를 자연스러운 문장으로 읽어주기 (HTML 태그·이모지 제거)
function speakGuide(text){
  try{
    if(!soundOn) return;
    if(!('speechSynthesis'in window)) return;
    // HTML 태그 제거, 이모지·기호 제거, 대괄호 소릿값은 남김
    let t=String(text).replace(/<[^>]+>/g,' ')
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\uFE0F]/gu,' ')
      .replace(/\s+/g,' ').trim();
    if(!t) return;
    speechSynthesis.cancel();
    const u=utter(t,0.95);
    speechSynthesis.speak(u);
  }catch(e){}
}
// 받침 소리 단독 재생
function speakBatchim(syl){
  try{
    speechSynthesis.cancel();
    const u=utter(syl+'.',0.8);
    speechSynthesis.speak(u);
  }catch(e){}
}

function confetti(){
  const ems=['⭐','🎉','🌟','✨','🍭','🎈'];
  for(let i=0;i<22;i++){
    const c=document.createElement('div');
    c.className='confetti';c.textContent=ems[i%ems.length];
    c.style.left=Math.random()*100+'vw';
    c.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    c.style.fontSize=(1+Math.random())+'rem';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3200);
  }
}

        <button class="sbtn skip" id="micSkip">나중에 할래요</button>
      </div>
      <div class="mic-status" id="micStatus"></div>
    </div>`;
  speakGuide((studentName?studentName+'님, ':'')+' 안녕하세요! 마이크를 켤까요?');
  const status=document.getElementById('micStatus');
  document.getElementById('micAllow').addEventListener('click',async()=>{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      status.className='mic-status no';

    status.textContent='마이크 사용을 허용해 주세요…';
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      stream.getTracks().forEach(t=>t.stop());
      micGranted=true;
      status.className='mic-status ok';
      status.textContent='마이크 준비 완료! 🎧';
      setTimeout(goGrid,900);
    }catch(err){
      micGranted=false;
      status.className='mic-status no';
      status.textContent='마이크를 켜지 못했어요. 녹음 없이도 학습할 수 있어요 🙂';
      setTimeout(goGrid,1500);
    }
  });
  document.getElementById('micSkip').addEventListener('click',()=>{ micGranted=false; goGrid(); });
}

/* 한 음절을 자모 획으로 합성해 inline SVG로 그림.
   초성+중성은 검정, 받침(종성)만 color 로 칠해 "글자 안 받침만 색칠" 효과.
   각 자모 원본 좌표(약 16~84 박스)를 지정한 사각영역(x,y,w,h)에 맞춰 배치 */
/* 낱말 표시: 모든 음절을 초성·중성·종성 자모 박스로 분해해 표시.
   강조 음절(o.hs)의 받침만 color 로 칠해 어떤 받침인지 드러냄. */
function wordHtml(o, color){
  const CHO_S=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const JUNG_S=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const JONG_S=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  return [...o.w].map((ch, k)=>{
    const code=ch.charCodeAt(0)-0xAC00;
    if(code<0 || code>11171) return `<span class="wsyl">${ch}</span>`; // 한글 아니면 그대로
    const cho=CHO_S[Math.floor(code/588)];
    const jung=JUNG_S[Math.floor((code%588)/28)];
    const jong=JONG_S[code%28];
    // 강조 음절이면 받침을 color 로, 아니면 검정 자모로 분해
    const hlColor = (k===o.hs) ? color : null;
    return syllableMiniBlock(cho,jung,jong,hlColor);
  }).join('');
}
// 단어 카드용 작은 자모 박스. color 가 주어지면 받침을 그 색으로 강조 */
function syllableMiniBlock(cho,jung,jong,color){
  const box=(j,isJong)=>{
    const colored=(isJong&&color);
    const style=colored?` style="color:${color};border-color:${color}"`:'';
    return `<span class="mbox${isJong?' mj':''}"${style}>${j}</span>`;
  };

  let top='';
  const parts=jung?VOWEL_PARTS[jung]:null;
  if(parts){
    // 이중모음: [base(ㅗ/ㅜ/ㅡ), secondary(ㅏ/ㅣ 등)]
    // 초성 + secondary를 가로로, 그 아래 base를 세로로
    const [base,sec]=parts;
    const baseIsHoriz=HORIZONTAL_VOWELS.includes(base);
    if(baseIsHoriz){
      // ㅗ/ㅜ/ㅡ 계열: 초성+sec 윗줄(가로), base 아랫줄
      top=`<span class="mtop vert">`+
          `<span class="mtop">${box(cho,false)}${box(sec,false)}</span>`+
          `${box(base,false)}`+
          `</span>`;
    }else{
      // 그 외: 초성 옆에 base+sec 세로로
      top=`<span class="mtop">${box(cho,false)}`+
          `<span class="mtop vert">${box(base,false)}${box(sec,false)}</span>`+
          `</span>`;
    }
  }else{
    const vert=HORIZONTAL_VOWELS.includes(jung);
    top=`<span class="mtop${vert?' vert':''}">${box(cho,false)}${jung?box(jung,false):''}</span>`;
  }

  const bottom=jong?box(jong,true):'';
  return `<span class="mblock">${top}${bottom}</span>`;
}

/* STEP 1: 소리 탐험
   - 낱말 카드를 눌러 읽기
   - multi(여러 받침 글자): 드래그로 받침별 바구니에 분류 → 소리가 같다는 것 발견
   - single(받침 글자 하나): 낱말 읽은 뒤 간단히 확인 */
function renderExplore(l){
  const body=document.getElementById('stepBody');
  const multi=l.letters.length>1;
  const PER_PAGE=6;                 // 한 페이지에 6개(3열×2줄)
  const totalPages=Math.ceil(l.ex.length/PER_PAGE);
  const total=l.ex.length;
  const readWords=new Set();
  let page=0;

  body.innerHTML=`
    ${fairyBar('낱말을 하나씩 눌러 <b>끝소리</b>를 들어 봐요 👆')}
    <div class="ex-grid" id="ex"></div>
    ${totalPages>1?`<div class="pager" id="pager">
      <button class="pager-btn" id="pgPrev">◀</button>
      <span class="pager-info" id="pgInfo"></span>
      <button class="pager-btn" id="pgNext">▶</button>
    </div>`:''}
    <div class="row-btns">
      <button class="btn back" id="backB">⬅ 받침 고르기</button>
      <button class="btn next" id="nextB" disabled>${multi?'받침 글자별로 모아보기 ➡':'따라 말하기 ➡'}</button>
    </div>`;

  const exEl=document.getElementById('ex');
  const note=document.getElementById('fairyMsg');
  const nextB=document.getElementById('nextB');

  function checkAllRead(){
    if(readWords.size>=total){
      if(multi){
        note.innerHTML='낱말 소리를 모두 들었어요! 이제 받침 글자별로 모아 볼까요? 🤔';
        nextB.disabled=false;
      }else{
        note.innerHTML='낱말 소리를 모두 들었어요! 끝소리가 같은지 생각해 볼까요? 🤔';
        askSingleSoundQuestion(l, nextB, note);
      }
    }
  }

  function renderPage(){
    exEl.innerHTML='';
    const startIdx=page*PER_PAGE;
    const items=l.ex.slice(startIdx, startIdx+PER_PAGE);
    items.forEach(o=>{
      const c=document.createElement('div');
      c.className='ex-card'+(readWords.has(o.w)?' heard':'');
      c.innerHTML=`<div class="ee">${o.e}</div><div class="ew">${wordHtml(o,l.c)}</div>`;
      c.addEventListener('click',()=>{
        document.querySelectorAll('.ex-card').forEach(x=>x.classList.remove('lit'));
        c.classList.add('lit','heard');
        speak(o.w,.78);
        readWords.add(o.w);
        if(readWords.size>=total){ checkAllRead(); }
        else{ note.innerHTML=`잘 들었어요! 남은 낱말도 들어 볼까요? (${readWords.size}/${total})`; }
      });
      exEl.appendChild(c);
    });
    // 페이저 갱신
    const pgInfo=document.getElementById('pgInfo');
    if(pgInfo) pgInfo.textContent=`${page+1} / ${totalPages} 쪽`;
    const pgPrev=document.getElementById('pgPrev'), pgNext=document.getElementById('pgNext');
    if(pgPrev) pgPrev.disabled = page===0;
    if(pgNext) pgNext.disabled = page>=totalPages-1;
  }

  renderPage();

  if(totalPages>1){
    document.getElementById('pgPrev').addEventListener('click',()=>{ if(page>0){page--;renderPage();} });
    document.getElementById('pgNext').addEventListener('click',()=>{ if(page<totalPages-1){page++;renderPage();} });
  }

  document.getElementById('backB').addEventListener('click',goGrid);
  nextB.addEventListener('click',()=>{
    if(multi){ renderSort(l); }
    else{ step=1; renderDetail(); }
  });
}

/* ── 받침 글자별 분류 화면 (별도 화면) ── */

  const body=document.getElementById('stepBody');
  body.innerHTML=`
    ${fairyBar('낱말을 끌어서 알맞은 <b>받침 바구니</b>에 넣어요 👆')}
    <div class="baskets-row" id="baskets"></div>
    <div class="drag-pool" id="pool"></div>
    <div class="drag-msg" id="dmsg" style="display:none"></div>
    <div class="row-btns">
      <button class="btn back" id="sortBackB">⬅ 소리 탐험</button>
      <button class="btn next" id="sortNextB" disabled>따라 말하기 ➡</button>
    </div>`;

  const basketsEl=document.getElementById('baskets');
  const pool=document.getElementById('pool');
  const dmsg=document.getElementById('fairyMsg');
  const sortNextB=document.getElementById('sortNextB');

  const placed={};
  l.letters.forEach(letter=>{
    placed[letter]=[];
    const bk=document.createElement('div');
    bk.className='basket'; bk.dataset.letter=letter;
    bk.style.setProperty('--c',l.c); bk.style.setProperty('--cb',l.cb);
    // 정답(소릿값)을 미리 보여주지 않음 — 받침 글자만 표시
    bk.innerHTML=`<div class="bk-lbl">받침 ${letter}</div>
      <div class="bk-items" id="bk-${letter}"></div>`;
    bk.addEventListener('dragover',e=>{e.preventDefault();bk.classList.add('drag-over');});
    bk.addEventListener('dragleave',()=>bk.classList.remove('drag-over'));
    bk.addEventListener('drop',e=>{
      e.preventDefault(); bk.classList.remove('drag-over');
      const data=JSON.parse(e.dataTransfer.getData('text/plain'));
      dropOnBasket(data, letter, bk, l);
    });
    basketsEl.appendChild(bk);
  });

  const tokens=[...l.ex].sort(()=>Math.random()-.5);
  tokens.forEach(o=>{
    pool.appendChild(makeToken(o, pool, basketsEl, dmsg, placed, l, sortNextB, null, null, null));
  });

  // 분류 완료 → 학생이 스스로 생각해보도록 질문
  _onSortComplete=()=>{ askSoundQuestion(l, sortNextB, dmsg); };

  document.getElementById('sortBackB').addEventListener('click',()=>{step=0; renderDetail();});
  sortNextB.addEventListener('click',()=>{step=1; renderDetail();});
}

/* ── 드래그 토큰 생성 (마우스 + 터치 드래그 모두 지원) ── */
function makeToken(o, pool, basketsEl, dmsg, placed, l, nextB, note, revealBox, showReveal){
  const tok=document.createElement('div');
  tok.className='drag-token';
  tok.draggable=true;
  tok.dataset.word=o.w; tok.dataset.hi=o.hi;
  tok.style.setProperty('--c',l.c); tok.style.setProperty('--cb',l.cb);
  tok.innerHTML=`<div class="dt-e">${o.e}</div>
    <div class="dt-w">${wordHtml(o,l.c)}</div>`;

  /* 마우스 드래그 */
  tok.addEventListener('dragstart',e=>{
    tok.classList.add('dragging');
    e.dataTransfer.setData('text/plain',JSON.stringify({w:o.w,hi:o.hi}));
  });
  tok.addEventListener('dragend',()=>tok.classList.remove('dragging'));

  /* 터치 드래그 – 클론을 손가락에 붙여서 이동, touchend에서 바구니 찾기 */
  let clone=null, startX=0, startY=0;
  tok.addEventListener('touchstart',e=>{
    const t=e.touches[0]; startX=t.clientX; startY=t.clientY;
    clone=tok.cloneNode(true);
    clone.style.cssText=`position:fixed;z-index:999;opacity:.85;pointer-events:none;
      left:${t.clientX-40}px;top:${t.clientY-50}px;transform:scale(1.1);`;
    document.body.appendChild(clone);
    tok.style.opacity='.3';
  },{passive:true});
  tok.addEventListener('touchmove',e=>{
    e.preventDefault();
    const t=e.touches[0];
    if(clone){clone.style.left=(t.clientX-40)+'px';clone.style.top=(t.clientY-50)+'px';}
  },{passive:false});
  tok.addEventListener('touchend',e=>{
    if(clone){clone.remove();clone=null;}
    tok.style.opacity='1';
    const t=e.changedTouches[0];
    // 손가락 좌표 아래 바구니 찾기
    const el=document.elementFromPoint(t.clientX, t.clientY);
    const bk=el&&el.closest('.basket');
    if(bk) dropOnBasket({w:o.w,hi:o.hi}, bk.dataset.letter, bk, l);
  });

  return tok;
}

/* ── 바구니에 단어를 놓는 처리 ── */
function dropOnBasket(data, letter, bk, l){
  const pool=document.getElementById('pool');
  const dmsg=document.getElementById('fairyMsg');
  // pool에서 토큰 찾기
  const tok=[...pool.querySelectorAll('.drag-token')].find(t=>t.dataset.word===data.w);
  if(!tok)return; // 이미 배치됨

  const correct=(data.hi===letter);
  if(correct){
    // 바구니 안 칩으로 추가
    const chip=document.createElement('span');
    chip.className='bk-chip';chip.textContent=data.w;
    bk.querySelector('.bk-items').appendChild(chip);
    tok.remove();
    // 모두 배치됐는지 확인
    const remaining=pool.querySelectorAll('.drag-token').length;
    if(remaining===0){
      document.querySelectorAll('.basket').forEach(b=>b.classList.add('correct'));
      dmsg.innerHTML='모두 모았어요! 👏';
      // 정답을 바로 보여주지 않고, 학생이 스스로 생각해보도록 질문
      if(typeof _onSortComplete==='function') _onSortComplete();
    }else{
      dmsg.innerHTML=`잘했어요! 남은 낱말도 넣어 볼까요? (${remaining}개 남음)`;
    }
  }else{
    // 오답: 흔들림 효과
    bk.style.animation='none';
    bk.classList.add('drag-over');
    dmsg.innerHTML=`음… <b>${data.w}</b>의 받침은 ${data.hi}이에요. 다시 도전! 🤔`;
    setTimeout(()=>{bk.classList.remove('drag-over');},500);
  }
}

// 한글만 남기고 공백·기호 제거 (비교용)

// 따라 말하기 결과를 구글 시트에 기록 (Apps Script로 전송)
function logToSheet(payload){
  if(!SHEET_API_URL || SHEET_API_URL==='__SHEET_API_URL__') return;
  try{
    // no-cors: 응답은 못 받지만 기록은 됨
    fetch(SHEET_API_URL, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    });

      rec.maxAlternatives=3;
      recognizing=true;
      recB.classList.add('recording'); recB.textContent='👂 듣는 중…';
      heardBox.style.display='none';
      rmsg.innerHTML='<span class="recdot"></span>지금 말해 봐요! "'+word.w+'"';
      // 녹음 시작 후 건너뛰기 버튼 표시
      document.getElementById('skipB')?.classList.remove('hidden');

      rec.onresult=(ev)=>{
        // 여러 후보 중 정답과 일치하는 게 있으면 통과
        const alts=[];
        for(let i=0;i<ev.results[0].length;i++) alts.push(ev.results[0][i].transcript);
        const heard=alts[0]||'';
        const target=normKo(word.w);
        const matched=alts.some(a=>normKo(a)===target);

        heardBox.style.display='block';
        heardBox.innerHTML=`내가 말한 말: <b>${heard||'(잘 안 들렸어요)'}</b>`;
        heardBox.className='heard-box '+(matched?'ok':'no');

        // 시트 기록
        logToSheet({ name:studentName||'(손님)', word:word.w, heard:heard, ok:matched, time:new Date().toLocaleString('ko-KR') });

        if(matched){
          passed=true;
          rmsg.textContent='딩동댕! 정확하게 말했어요 🎉';
          wNextB.disabled=false;
          confetti();
        }else{
          passed=false;
          rmsg.textContent='다시 한번! 🔊 듣기로 소리를 듣고 또박또박 말해 봐요 🙂';
          wNextB.disabled=true;
        }
      };
      rec.onerror=()=>{
        heardBox.style.display='block';
        heardBox.className='heard-box no';
        heardBox.innerHTML='소리를 잘 못 들었어요. 다시 🎤 말하기를 눌러 봐요!';
        rmsg.textContent='조용한 곳에서 또박또박 말해 봐요 🙂';
      };
      rec.onend=()=>{ recognizing=false; recB.classList.remove('recording'); recB.textContent='🎤 다시 말하기'; };
      try{ rec.start(); }catch(e){ recognizing=false; }
    });
    // 음성 인식 모드에선 '내 소리 듣기' 숨김
    playB.style.display='none';
  }

  /* ───────── 방향 B: 녹음 + 자기 확인 (인식 미지원 기기) ───────── */
  else {
    let recording=false;
    const selfRate=document.getElementById('selfRate');
    const starsWrap=document.getElementById('stars');
    const srMsg=document.getElementById('srMsg');
    let myStars=0;

    function showRated(){
      // 별표를 눌러야 '다음으로'가 의미있지만, 안 눌러도 넘어갈 수 있게 함
    }
    // 별 클릭
    if(starsWrap){
      starsWrap.querySelectorAll('.star').forEach(st=>{
        st.addEventListener('click',()=>{
          myStars=+st.dataset.v;
          starsWrap.querySelectorAll('.star').forEach((s,i)=>s.classList.toggle('on', i<myStars));
          const msgs=['조금 더 연습해 볼까요? 💪','좋아요! 또 해볼까요? 🙂','잘했어요! 👍','아주 잘했어요! 🌟','완벽해요! 최고예요! 🌟🌟🌟 🌸'];
          srMsg.textContent=msgs[myStars-1]||'';
        });
      });
    }

    recB.addEventListener('click',async()=>{
      if(!navigator.mediaDevices||!window.MediaRecorder){
        rmsg.textContent='이 기기에서는 녹음이 안 돼요. 듣고 따라 말한 뒤 넘어가요 🙂';
        if(selfRate) selfRate.style.display='block';
        return;
      }
      if(!recording){
        try{
          const stream=await navigator.mediaDevices.getUserMedia({audio:true});
          mediaRec=new MediaRecorder(stream); recChunks=[];
          mediaRec.ondataavailable=e=>{if(e.data.size>0)recChunks.push(e.data);};
          mediaRec.onstop=()=>{
            if(recURL)URL.revokeObjectURL(recURL);
            recURL=URL.createObjectURL(new Blob(recChunks,{type:'audio/webm'}));
            recAudio=new Audio(recURL);
            playB.disabled=false;
            rmsg.textContent='녹음 완료! 내 소리를 듣고 별표로 평가해 봐요 🎧';
            logToSheet({ name:studentName||'(손님)', word:word.w, heard:'(녹음)', ok:true, time:new Date().toLocaleString('ko-KR') });
            // 별표 평가 영역 표시 + 자동 재생
            if(selfRate) selfRate.style.display='block';
            if(recAudio){ setTimeout(()=>recAudio.play(),300); }
            stream.getTracks().forEach(t=>t.stop());
          };
          mediaRec.start(); recording=true;
          recB.classList.add('recording'); recB.textContent='⏹️ 멈추기';
          rmsg.innerHTML='<span class="recdot"></span>녹음 중… "'+word.w+'" 라고 말해 봐요!';
          if(selfRate) selfRate.style.display='none';
        }catch(err){
          rmsg.textContent='마이크를 쓸 수 없어요. 듣고 따라 말한 뒤 넘어가도 좋아요 🙂';
          if(selfRate) selfRate.style.display='block';
        }
      }else{
        if(mediaRec&&mediaRec.state!=='inactive')mediaRec.stop();
        recording=false; recB.classList.remove('recording'); recB.textContent='🎙️ 녹음하기';
      }
    });
    playB.addEventListener('click',()=>{
      if(recAudio){recAudio.currentTime=0;recAudio.play();}
    });

    // 별표 영역 버튼들
    document.getElementById('reRecB')?.addEventListener('click',()=>{
      // 다시 녹음: 별 초기화 후 바로 녹음 시작
      myStars=0; if(starsWrap) starsWrap.querySelectorAll('.star').forEach(s=>s.classList.remove('on'));
      if(srMsg) srMsg.textContent='';
      recB.click();
    });
    document.getElementById('rePlayB')?.addEventListener('click',()=>{
      if(recAudio){recAudio.currentTime=0;recAudio.play();}
    });
    document.getElementById('srGoB')?.addEventListener('click',()=>{
      logToSheet({ name:studentName||'(손님)', word:word.w, heard:'(별 '+myStars+'개)', ok:true, time:new Date().toLocaleString('ko-KR') });
      stopRec();
      if(isLast){sayWordIdx=0;step=2;renderDetail();}
      else{sayWordIdx++;renderSay(l);}
    });
  }

  document.getElementById('wPrevB').addEventListener('click',()=>{
    stopRec();
    if(sayWordIdx===0){step=0;renderDetail();}
    else{sayWordIdx--;renderSay(l);}
  });
  // 건너뛰기 버튼 (음성 인식 모드에서만 표시)
  const skipB=document.getElementById('skipB');
  if(skipB){
    skipB.addEventListener('click',()=>{
      logToSheet({name:studentName||'(손님)', word:word.w, heard:'(건너뜀)', ok:false, time:new Date().toLocaleString('ko-KR')});
      stopRec();
      if(isLast){sayWordIdx=0;step=2;renderDetail();}
      else{sayWordIdx++;renderSay(l);}
    });
  }
  wNextB.addEventListener('click',()=>{
    if(wNextB.disabled) return;
    stopRec();
    if(isLast){sayWordIdx=0;step=2;renderDetail();}
    else{sayWordIdx++;renderSay(l);}
  });
}
function stopRec(){
  try{if(mediaRec&&mediaRec.state!=='inactive')mediaRec.stop();}catch(e){}
  if(recURL){URL.revokeObjectURL(recURL);recURL=null;} recAudio=null;
}

/* ════════════════════════════════════════════════════════════════
   따라 쓰기 엔진 — 마우스/손가락으로 획순을 정확히 따라야 통과
   ════════════════════════════════════════════════════════════════ */
// SVG path 문자열을 100x100 좌표계의 점 배열로 샘플링
function samplePath(d, n=24){
  const svgNS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(svgNS,'svg');
  svg.setAttribute('viewBox','0 0 100 100');
  svg.style.position='absolute';svg.style.width='100px';svg.style.height='100px';
  svg.style.left='-9999px';
  const p=document.createElementNS(svgNS,'path');
  p.setAttribute('d',d);
  svg.appendChild(p);document.body.appendChild(svg);
  const len=p.getTotalLength();
  const pts=[];
  for(let i=0;i<=n;i++){const pt=p.getPointAtLength(len*i/n);pts.push({x:pt.x,y:pt.y});}
  document.body.removeChild(svg);
  return pts;
}

// 따라 쓰기 모달 열기: word의 모든 음절을 자모 칸으로, 획순대로 직접 쓰게 함
// hsIndex: 강조(받침 색칠) 음절, jongColor: 받침 색. onDone: 완료 콜백
function openTraceModal(word, hsIndex, onDone){
  // 음절 → 자모 시퀀스 만들기 (초성, 중성, 받침 순)
  const CHO_S=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const JUNG_S=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const JONG_S=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

  // syllables: [{cells:[{jamo,isJong,paths:[...]}], vert}]
  const syllables=[];
  [...word].forEach((ch,si)=>{
    const code=ch.charCodeAt(0)-0xAC00;
    if(code<0||code>11171) return;
    const cho=CHO_S[Math.floor(code/588)];
    const jung=JUNG_S[Math.floor((code%588)/28)];
    const jong=JONG_S[code%28];
    const vert=HORIZONTAL_VOWELS.includes(jung);
    const cells=[];
    if(STROKES[cho]) cells.push({jamo:cho,isJong:false,paths:STROKES[cho]});
    // 모음: 이중모음도 STROKES에 합성 획이 있으면 한 칸으로
    if(jung&&STROKES[jung]) cells.push({jamo:jung,isJong:false,paths:STROKES[jung]});
    if(jong&&STROKES[jong]) cells.push({jamo:jong,isJong:true,paths:STROKES[jong]});
    syllables.push({cells,vert,si});
  });

  // 전체 칸을 한 줄로(쓰기 순서대로) 모음
  const allCells=[];
  syllables.forEach(syl=>syl.cells.forEach(c=>allCells.push(c)));

  // 오버레이 DOM
  const ov=document.createElement('div');
  ov.className='trace-overlay';
  ov.innerHTML=`
    <div class="trace-modal">
      <p class="tm-title">"${word}" 따라 쓰기 ✏️</p>
      <p class="tm-sub">노란 칸의 회색 획을 손가락(마우스)으로 따라 그려요</p>
      <div class="trace-syllables" id="tsyl"></div>
      <p class="tm-msg" id="tmsg">첫 번째 획부터 따라 그려 보세요!</p>
      <div class="tm-btns">
        <button class="btn back" id="tCancel">그만하기</button>
        <button class="btn next" id="tReplay" style="background:var(--sun)">↻ 다시</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  const tsyl=ov.querySelector('#tsyl');
  const tmsg=ov.querySelector('#tmsg');

  // 음절별 칸 렌더
  const cellEls=[]; // 전역 칸 순서와 매칭
  syllables.forEach(syl=>{
    const block=document.createElement('div');block.className='tcell-stack';
    const top=document.createElement('div');top.className='tcell-row'+(syl.vert?' vert':'');
    const bottomWrap=document.createElement('div');bottomWrap.className='tcell-row';
    syl.cells.forEach(c=>{
      const cell=makeTraceCell(c);
      cellEls.push({cell,info:c});
      if(c.isJong) bottomWrap.appendChild(cell); else top.appendChild(cell);
    });
    block.appendChild(top);
    if(bottomWrap.children.length) block.appendChild(bottomWrap);
    tsyl.appendChild(block);
  });

  // 진행 상태
  let curCell=0;       // 현재 칸 index (cellEls)
  let curStroke=0;     // 현재 칸 안의 획 index
  let wrongCount=0;    // 현재 획에서 틀린 횟수

  function highlightCurrent(){
    cellEls.forEach((c,i)=>{
      c.cell.classList.toggle('active', i===curCell && !c.cell.classList.contains('done'));
      // 다른 칸의 시작점은 숨김
      if(c.cell._startDot && i!==curCell) c.cell._startDot.classList.remove('show');
    });
    // 현재 칸의 현재 획 가이드 강조 + 시작점 표시
    if(curCell<cellEls.length){
      const cell=cellEls[curCell].cell;
      const guides=cell.querySelectorAll('.tguide');
      guides.forEach((g,i)=>g.classList.toggle('cur', i===curStroke));
      // 현재 획의 시작점에 빨간 동그라미 표시(처음부터, 매 획마다)
      const d=cell._paths && cell._paths[curStroke];
      if(d && cell._startDot){
        const pts=samplePath(d,2);
        cell._startDot.setAttribute('cx',pts[0].x);
        cell._startDot.setAttribute('cy',pts[0].y);
        cell._startDot.classList.add('show');
      }
    }
  }

  // 현재 칸의 현재 획을 "쓰는 법"으로 다시 보여줌 (애니메이션 + 시작점 표시)
  function showStrokeDemo(){
    if(curCell>=cellEls.length) return;
    const cell=cellEls[curCell].cell;
    const d=cell._paths[curStroke];
    if(!d) return;
    const demo=cell._demoPath, dot=cell._startDot;
    // 시범 획 설정 + 애니메이션 리셋
    demo.setAttribute('d',d);
    demo.style.opacity='1';
    demo.classList.remove('run'); void demo.getBoundingClientRect();
    demo.classList.add('run');
    // 시작점 동그라미: 획 시작 위치에
    const pts=samplePath(d,2);
    dot.setAttribute('cx',pts[0].x); dot.setAttribute('cy',pts[0].y);
    dot.classList.add('show');
    cell.classList.add('hintflash');
    // 시범 끝나면 시범 획 숨김(가이드는 남김)
    setTimeout(()=>{
      demo.style.opacity='0'; demo.classList.remove('run');
      cell.classList.remove('hintflash');
    },1300);
    setTimeout(()=>dot.classList.remove('show'),1800);
  }

  function strokeDone(){
    wrongCount=0; // 성공했으니 틀린 횟수 초기화
    // 현재 획을 완성 표시
    const c=cellEls[curCell];
    const donePaths=c.cell.querySelectorAll('.tdone');
    if(donePaths[curStroke]) donePaths[curStroke].style.opacity='1';
    curStroke++;
    if(curStroke>=c.info.paths.length){
      // 칸 완료
      c.cell.classList.add('done');c.cell.classList.remove('active');
      curCell++; curStroke=0;
      if(curCell>=cellEls.length){
        // 단어 완성!
        tmsg.textContent='참 잘했어요! 모두 따라 썼어요 🎉';
        try{speak(word,.8);}catch(e){}
        confetti();
        setTimeout(()=>{ cleanup(); onDone&&onDone(); }, 900);
        return;
      }
    }
    highlightCurrent();
    tmsg.textContent='좋아요! 다음 획을 따라 그려요 ✍️';
  }

  function makeTraceCell(c){
    const svgNS='http://www.w3.org/2000/svg';
    const cell=document.createElement('div');
    cell.className='tcell'+(c.isJong?' batchim':'');
    const svg=document.createElementNS(svgNS,'svg');
    svg.setAttribute('viewBox','0 0 100 100');
    // 가이드 획(회색) + 완성 획(숨김) + 사용자 획
    c.paths.forEach((d)=>{
      const g=document.createElementNS(svgNS,'path');
      g.setAttribute('d',d);g.setAttribute('class','tguide');svg.appendChild(g);
    });
    c.paths.forEach((d)=>{
      const done=document.createElementNS(svgNS,'path');
      done.setAttribute('d',d);done.setAttribute('class','tdone');done.style.opacity='0';svg.appendChild(done);
    });
    // 시범 획(틀렸을 때 보여줌) — 현재 획 하나만 그림
    const demoPath=document.createElementNS(svgNS,'path');
    demoPath.setAttribute('class','tdemo');demoPath.style.opacity='0';svg.appendChild(demoPath);
    // 시작점 안내 동그라미
    const startDot=document.createElementNS(svgNS,'circle');
    startDot.setAttribute('class','tstart');startDot.setAttribute('r','5');svg.appendChild(startDot);
    const userPath=document.createElementNS(svgNS,'path');
    userPath.setAttribute('class','tuser');svg.appendChild(userPath);
    cell.appendChild(svg);
    // 시범/시작점 요소를 셀에 보관
    cell._demoPath=demoPath; cell._startDot=startDot; cell._svg=svg;
    cell._paths=c.paths;

    // 좌표 변환: 화면 → 0~100 viewBox
    function toVB(clientX,clientY){
      const r=svg.getBoundingClientRect();
      return {x:(clientX-r.left)/r.width*100, y:(clientY-r.top)/r.height*100};
    }
    let drawing=false, userPts=[];
    function startDraw(x,y){
      // 이 칸이 현재 칸이 아니면 무시
      if(cellEls[curCell] && cellEls[curCell].cell!==cell) return;
      drawing=true; userPts=[toVB(x,y)]; updateUser();
    }
    function moveDraw(x,y){
      if(!drawing) return;
      userPts.push(toVB(x,y)); updateUser();
    }
    function endDraw(){
      if(!drawing) return;
      drawing=false;
      checkStroke();
      userPath.setAttribute('d','');
    }
    function updateUser(){
      if(!userPts.length){userPath.setAttribute('d','');return;}
      userPath.setAttribute('d','M'+userPts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' L'));
    }
    // 그린 경로가 현재 획(목표)을 올바른 방향·순서로 따라갔는지 판정
    function checkStroke(){
      // 이 셀이 지금 써야 할 셀이 아니면 무시
      if(!cellEls[curCell] || cellEls[curCell].cell!==cell){return;}
      if(!c.paths[curStroke]) return;
      if(userPts.length<2){
        tmsg.textContent='획을 따라 천천히 그어 보세요 ✍️';
        return;
      }
      const target=samplePath(c.paths[curStroke]); // 시작→끝 순서 (= 올바른 필순 방향)
      // 1) 커버리지: 사용자 경로가 목표 획의 점들을 충분히 지났는가
      const TOL=22;
      let covered=0;
      target.forEach(tp=>{
        let md=1e9;
        userPts.forEach(up=>{const dx=up.x-tp.x,dy=up.y-tp.y;md=Math.min(md,Math.hypot(dx,dy));});
        if(md<=TOL) covered++;
      });
      const ratio=covered/target.length;

      // 2) 방향 검증: 사용자 시작점은 목표 시작점에, 끝점은 목표 끝점에 가까워야 함
      const tStart=target[0], tEnd=target[target.length-1];
      const uStart=userPts[0], uEnd=userPts[userPts.length-1];
      const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
      // 올바른 방향: 시작↔시작, 끝↔끝
      const fwd = dist(uStart,tStart)+dist(uEnd,tEnd);
      // 거꾸로 그린 경우: 시작↔끝, 끝↔시작
      const rev = dist(uStart,tEnd)+dist(uEnd,tStart);
      const directionOK = fwd <= rev;          // 정방향이 역방향보다 가까워야 통과
      const endpointOK  = (dist(uStart,tStart) < 34) && (dist(uEnd,tEnd) < 34); // 시작·끝점이 제자리

      const okCover = ratio>=0.65;
      if(okCover && directionOK && endpointOK){
        strokeDone();
      }else if(okCover && !directionOK){
        // 방향이 거꾸로
        wrongCount++;
        const horiz = Math.abs(tEnd.x-tStart.x) > Math.abs(tEnd.y-tStart.y);
        tmsg.textContent = horiz
          ? '가로획은 왼쪽 → 오른쪽! 이렇게 써요 👇'
          : '세로획은 위 → 아래! 이렇게 써요 👇';
        showStrokeDemo();  // 쓰는 법 다시 보여주기
      }else{
        wrongCount++;
        if(wrongCount===1){
          tmsg.textContent='회색 획을 따라 그려 봐요 ✍️';
          cell.animate([{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:250});
        }else{
          // 두 번 이상 틀리면 쓰는 법을 다시 보여줌
          tmsg.textContent='이렇게 써요! 잘 보고 따라 그려요 👇';
          showStrokeDemo();
        }
      }
    }
    // 포인터 이벤트(마우스+터치 통합)
    cell.addEventListener('pointerdown',e=>{e.preventDefault();cell.setPointerCapture(e.pointerId);startDraw(e.clientX,e.clientY);});
    cell.addEventListener('pointermove',e=>moveDraw(e.clientX,e.clientY));
    cell.addEventListener('pointerup',endDraw);
    cell.addEventListener('pointercancel',endDraw);
    return cell;
  }

  function cleanup(){ ov.remove(); }
  ov.querySelector('#tCancel').addEventListener('click',cleanup);
  ov.querySelector('#tReplay').addEventListener('click',()=>{
    // 처음부터 다시
    cellEls.forEach(c=>{
      c.cell.classList.remove('done','active');
      c.cell.querySelectorAll('.tdone').forEach(p=>p.style.opacity='0');
    });
    curCell=0;curStroke=0;wrongCount=0;highlightCurrent();
    tmsg.textContent='다시 처음 획부터 따라 그려 보세요!';
  });
  // 배경 클릭 시 닫기 방지(실수 방지) — 모달 안만 동작
  ov.addEventListener('pointerdown',e=>{ if(e.target===ov) e.stopPropagation(); });

  highlightCurrent();
}

/* STEP 3: 써 보기 (획순 따라 쓰기) — 모든 낱말을 차례로 */
let writeWordIdx=0;
function renderWrite(l){
  if(writeWordIdx>=l.ex.length) writeWordIdx=0;
  const body=document.getElementById('stepBody');
  const word=l.ex[writeWordIdx];
  const total=l.ex.length;
  const dots=l.ex.map((_,i)=>`<span class="wp-dot ${i===writeWordIdx?'on':(i<writeWordIdx?'done':'')}"></span>`).join('');
  const isLast=writeWordIdx>=total-1;
  body.innerHTML=`
    ${fairyBar(`"<b>${word.w}</b>" 전체를 보거나, <b>자음/모음</b>을 눌러 하나씩 볼 수 있어요 ✍️`)}
    <div class="word-progress">${dots}</div>
    <div class="trace-wrap">
      <div class="trace-syl">${wordBlocks(word.w, true)}</div>
      <div class="rec-controls">
        <button class="mini play" id="playB" style="background:var(--sun);color:#fff">✍️ 전체 순서 보기</button>
        <button class="mini ghostbtn" id="traceB">🖐️ 따라 쓰기</button>
      </div>
      <div class="rec-msg" id="wmsg">버튼을 누르거나 자음/모음을 눌러 쓰는 순서를 살펴봐요 (${writeWordIdx+1}/${total})</div>
    </div>
    <div class="row-btns">
      <button class="btn back" id="wPrevB">⬅ ${writeWordIdx===0?'따라 말하기':'이전 낱말'}</button>
      <button class="btn next" id="wNextB" disabled>${isLast?'다 했어요 ✅':'다음 낱말 ➡'}</button>
    </div>`;
  const playB=document.getElementById('playB');
  const traceB=document.getElementById('traceB');
  const wmsg=document.getElementById('wmsg');
  const wNextB=document.getElementById('wNextB');
  let traced=false;

  // strokes: 특정 음절(syl-block)만, 또는 전체를 순서대로 애니메이션
  function animate(scope){
    const root = scope || body;
    const strokes=[...root.querySelectorAll('.ink')]
      .sort((a,b)=>(+a.dataset.order)-(+b.dataset.order));
    // 전체 애니메이션 시 다른 음절 획도 초기화
    body.querySelectorAll('.ink').forEach(s=>s.classList.remove('write'));
    void body.offsetWidth;
    let delay=0;
    strokes.forEach(s=>{
      setTimeout(()=>{s.classList.add('write');},delay);
      delay+=750;
    });
    return delay;
  }
  playB.addEventListener('click',()=>{
    animate();
    wmsg.textContent='획을 순서대로 잘 보세요. 그다음 "따라 쓰기"를 눌러요 ✍️';
  });
  // 각 자모 박스 클릭 → 그 자모의 획순만 보기
  body.querySelectorAll('.jamo-click').forEach(box=>{
    box.addEventListener('click',()=>{
      // 모든 획 숨기기
      body.querySelectorAll('.ink').forEach(s=>s.classList.remove('write'));
      void body.offsetWidth;
      // 이 박스 안의 획만 순서대로 애니메이션
      const strokes=[...box.querySelectorAll('.ink')]
        .sort((a,b)=>(+a.dataset.order)-(+b.dataset.order));
      let delay=0;
      strokes.forEach(s=>{ setTimeout(()=>s.classList.add('write'), delay); delay+=750; });
      // 강조 효과
      body.querySelectorAll('.jamo-click').forEach(b=>b.classList.remove('jamo-flash'));
      box.classList.add('jamo-flash');
      setTimeout(()=>box.classList.remove('jamo-flash'),600);
      wmsg.textContent=`'${box.dataset.jamo}' 쓰는 순서예요! 다른 자모도 눌러 봐요 ✍️`;
    });
  });
  traceB.addEventListener('click',()=>{
    openTraceModal(word.w, word.hs, ()=>{
      // 따라 쓰기 완료 콜백
      traced=true;
      traceB.classList.add('checked'); traceB.textContent='✅ 따라 썼어요';
      wmsg.textContent=`참 잘했어요! "${word.w}" 을(를) 따라 썼어요 🎉`;
      wNextB.disabled=false;
    });
  });

  document.getElementById('wPrevB').addEventListener('click',()=>{
    if(writeWordIdx===0){step=1;renderDetail();}
    else{writeWordIdx--;renderWrite(l);}
  });
  wNextB.addEventListener('click',()=>{
    if(wNextB.disabled) return;
    if(isLast){
      writeWordIdx=0;
      completed[LESSON[curIdx].jong]=true;
      // 공책 쓰기 화면을 거친 후 완료
      renderNotebook(l, finishDetail);
    }else{
      writeWordIdx++;renderWrite(l);
    }
  });
}

/* 받침 하나 완료 → 공책 쓰기 화면 → 완료 */
function renderNotebook(l, onDone){
  homeFab.classList.add('hidden');
  subtitle.textContent='';
  const TOTAL=10;
  function nbRow(word){
    const chars=[...word];
    const cells=chars.map(ch=>`<div class="nb-cell example"><span class="cross-h"></span><span class="cross-v"></span><span class="nb-char">${ch}</span></div>`).join('');
    return `<div class="nb-word-row">${cells}</div>`;
  }
  const rows=l.ex.map(o=>nbRow(o.w)).join('');
  view.innerHTML=`
    <div class="detail" style="--c:${l.c};--cb:${l.cb}">
      <div class="notebook-wrap">
        <p class="nb-title">✏️ 공책에 써 봐요</p>
        <div class="nb-rows">
          ${rows}
        </div>
      </div>
      <div class="row-btns" style="margin-top:clamp(8px,1.5vh,16px);flex-shrink:0;position:relative;z-index:5">
        <button class="btn back" id="nbBack" style="position:relative;z-index:5">⬅ 다시 써보기</button>
        <button class="btn next" id="nbDone" style="position:relative;z-index:5">다 했어요 ✅</button>
      </div>
    </div>`;
  document.getElementById('nbBack').addEventListener('click',()=>{
    writeWordIdx=0; step=2; renderDetail();
  });
  document.getElementById('nbDone').addEventListener('click',()=>{
    confetti(); onDone();
  });
  speakGuide('공책에 또박또박 써 봐요');
}
function finishDetail(){
  const l=LESSON[curIdx];
  const nextIdx = LESSON.findIndex((x,i)=>i>curIdx && !completed[x.jong]);
  const anotherIdx = nextIdx>=0 ? nextIdx : LESSON.findIndex(x=>!completed[x.jong]);
  const allOk = anotherIdx<0;
  const doneCount = LESSON.filter(x=>completed[x.jong]).length;
  const total = LESSON.length;
  // 진행 도장: 완료한 받침은 색칠, 나머지는 회색
  const stamps = LESSON.map(x=>{
    const ok=completed[x.jong];
    return `<span class="prog-stamp ${ok?'on':''}" style="${ok?`--c:${x.c};--cb:${x.cb}`:''}">${ok?x.jong:'·'}</span>`;
  }).join('');
  view.innerHTML=`
    <div class="finish-card ${allOk?'all':''}" style="--c:${l.c};--cb:${l.cb}">
      <div class="finish-burst">
        <span class="spark s1">✨</span><span class="spark s2">⭐</span>
        <span class="spark s3">🎉</span><span class="spark s4">✨</span>
        <div class="finish-medal">${allOk?'🏆':'🥇'}</div>
      </div>
      <div class="finish-badge" style="--c:${l.c};--cb:${l.cb}">
        <span class="fb-jong">${l.jong}</span>
        <span class="fb-txt">${l.name} 받침<br><b>완료!</b></span>
      </div>
      <p class="finish-msg">${allOk
        ? '🎊 받침 친구 일곱을 모두 만났어요!<br>받침이 달라도 소리는 일곱 가지였지요? <b>정말 대단해요!</b>'
        : `<b>참 잘했어요!</b> 받침이 달라도<br>끝소리는 <b>[${l.sound}]</b> 하나였지요?`}</p>
      <div class="finish-progress">
        <div class="prog-stamps">${stamps}</div>
        <div class="prog-label">받침 친구 <b>${doneCount}</b> / ${total} 명을 만났어요</div>
      </div>
      <div class="row-btns" style="margin-top:clamp(10px,2vh,20px);flex-shrink:0;position:relative;z-index:5">
        <button class="btn back" id="gridB">🏠 받침 고르기</button>
        ${allOk?'':`<button class="btn next" id="nextB">다음 받침 ➡</button>`}
      </div>
    </div>`;
  document.getElementById('gridB').addEventListener('click',goGrid);
  if(!allOk) document.getElementById('nextB').addEventListener('click',()=>openDetail(anotherIdx));
  confetti();
  if(allOk) setTimeout(confetti, 600);
  speakGuide(l.name+' 받침 완료! '+(allOk?'받침 친구를 모두 만났어요! 정말 대단해요':'참 잘했어요! 다음 받침도 만나 볼까요?'));
}

/* ════════════════════════════════════════════════════════════════
   구글 시트에서 단어 불러오기
   - 시트 열: 받침(대표받침 jong) | 단어 | 이모지
   - 받침 글자(hi)와 강조 음절 위치(hs)는 단어에서 자동 계산
   ════════════════════════════════════════════════════════════════ */
// 한 단어에서, 이 받침 그룹(letters)에 속하는 받침이 든 음절을 찾아 hi/hs 계산
function analyzeWord(word, letters){
  const chars=[...word];
  for(let k=0;k<chars.length;k++){
    const d=decompose(chars[k]);
    if(d && d[2] && letters.includes(d[2])){
      return {hi:d[2], hs:k};      // 그룹 받침이 든 음절
    }
  }
  // 못 찾으면 받침 든 첫 음절
  for(let k=0;k<chars.length;k++){
    const d=decompose(chars[k]);
    if(d && d[2]) return {hi:d[2], hs:k};
  }
  return {hi:letters[0], hs:0};
}

// 시트 행 배열 → LESSON.ex 갱신
function applySheetRows(rows){
  // rows: [{jong, word, emoji}, ...]
  const byJong={};
  rows.forEach(r=>{
    const jong=(r.jong||'').trim();
    const word=(r.word||'').trim();
    if(!jong||!word) return;
    (byJong[jong]=byJong[jong]||[]).push({w:word, e:(r.emoji||'📝').trim()});
  });
  LESSON.forEach(l=>{
    const list=byJong[l.jong];
    if(list && list.length){
      l.ex=list.map(item=>{
        const a=analyzeWord(item.w, l.letters);
        return {w:item.w, e:item.e, hi:a.hi, hs:a.hs};
      });
    }
  });
}

// Apps Script 웹앱 호출 → 시트 데이터 가져오기
async function loadFromSheet(){
  if(!SHEET_API_URL || SHEET_API_URL==='__SHEET_API_URL__') return false;
  try{
    const res=await fetch(SHEET_API_URL,{method:'GET'});
    const data=await res.json();
    if(Array.isArray(data.names)&&data.names.length){
      STUDENT_NAMES.splice(0,STUDENT_NAMES.length,...data.names);
    }
    const rows=Array.isArray(data)?data:(data.rows||[]);
    if(rows.length){applySheetRows(rows);return true;}
  }catch(e){
    console.warn('시트 불러오기 실패, 기본 데이터 사용:',e);
  }
  return false;
}

async function startApp(){
  if(SHEET_API_URL && SHEET_API_URL!=='__SHEET_API_URL__'){
    subtitle.textContent='데이터를 불러오는 중… ⏳';
    await loadFromSheet();
  }
  goIntro();
}
startApp();
